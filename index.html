  h1 {

    color: #c0392b;
    font-size: 20px;
    margin-bottom: 6px;
    text-transform: uppercase;
    line-height: 1.4;
  }
  .subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 24px;
    font-weight: 600;
  }
  label {
    display: block;
    font-weight: 600;
    color: #444;
    margin-bottom: 8px;
    font-size: 14px;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 18px;
    background: #fafafa;
  }
  select:focus, input[type="text"]:focus {
    border-color: #e74c3c;
    background: #fff;
  }
  button.check-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button.check-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
  }
  
  .message {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
    display: none;
    font-weight: 600;
  }
  .message.error { display: block; background: #ffe5e5; color: #c00; }
  .message.success { display: block; background: #e5ffe5; color: #080; }
  .message.info { display: block; background: #e5f0ff; color: #0055cc; }

  .result {
    margin-top: 24px;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .result.show { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .student-header {
    background: #fff3f3;
    padding: 16px;
    border-radius: 10px;
    border-left: 5px solid #e74c3c;
    margin-bottom: 16px;
  }
  .student-header strong {
    color: #c0392b;
    font-size: 18px;
  }
  .error-list {
    background: #fafafa;
    border-radius: 10px;
    padding: 20px;
    border: 1px solid #eee;
  }
  .error-list h3 {
    font-size: 15px;
    color: #e74c3c;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  ul {
    list-style: none;
  }
  ul li {
    padding: 8px 0;
    border-bottom: 1px dashed #ddd;
    font-size: 15px;
    color: #333;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
  }
  ul li:last-child { border-bottom: none; }
  ul li::before {
    content: "⚠️";
    margin-right: 10px;
    font-size: 14px;
  }
  .empty-state {
    text-align: center;
    padding: 30px 20px;
    background: #e5ffe5;
    border-radius: 10px;
    color: #1e7e34;
    font-weight: 600;
    font-size: 16px;
  }

const studentHeader = document.getElementById("studentHeader");
const errorListEl = document.getElementById("errorList");

for (const name in classList) {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  selectEl.appendChild(option);
}

// Hàm chuẩn hóa ngày tháng: Biến mọi định dạng (06/03/2015, 06.03.2015, 06032015) thành dd/mm/yyyy
function normalizeDate(dateStr) {
  // Loại bỏ mọi ký tự không phải là số
  let digits = dateStr.replace(/\D/g, ''); 
  
  // Nếu đủ 8 số (ddmmyyyy), tự động chèn dấu /
  if (digits.length === 8) {
    return `${digits.slice(0,2)}/${digits.slice(2,4)}/${digits.slice(4,8)}`;
  }
  
  // Nếu người dùng nhập có dấu chấm hoặc gạch chéo, thay thế hết bằng /
  let standardFormat = dateStr.replace(/[\.\-]/g, '/');
  
  // Tách ra để xử lý trường hợp nhập thiếu số 0 ở đầu (VD: 6/3/2015)
  let parts = standardFormat.split('/');
  if (parts.length === 3) {
    let d = parts[0].padStart(2, '0');
    let m = parts[1].padStart(2, '0');
    let y = parts[2];
    return `${d}/${m}/${y}`;
  }
  
  return standardFormat;
}

// Tự động format khi đang gõ (chỉ áp dụng nếu gõ toàn số)
dobInput.addEventListener("input", function(e) {
  let val = e.target.value;
  // Nếu chỉ toàn số, tự động thêm dấu / cho dễ nhìn
  if (/^\d+$/.test(val.replace(/\s/g, ''))) {
    let digits = val.replace(/\D/g, '');
    if (digits.length > 2 && digits.length <= 4) {
      val = digits.slice(0, 2) + '/' + digits.slice(2);
    } else if (digits.length > 4) {
      val = digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4, 8);
    }
    e.target.value = val;
  }
});

// ====== 4. XỬ LÝ KHI BẤM NÚT TRA CỨU ======
checkBtn.addEventListener("click", function() {
  const selectedName = selectEl.value;
  const dobRaw = dobInput.value.trim();

  messageEl.className = "message";
  messageEl.style.display = "none";
  resultEl.classList.remove("show");

  if (!selectedName) {
    showMessage("Vui lòng chọn tên học sinh.", "error");
    return;
  }
  if (!dobRaw) {
    showMessage("Vui lòng nhập ngày tháng năm sinh.", "error");
    return;
  }

  const correctDob = classList[selectedName];
  const inputDobNormalized = normalizeDate(dobRaw);

  // So sánh ngày sinh đã được chuẩn hóa
  if (correctDob !== inputDobNormalized) {
    showMessage("❌ Ngày sinh không khớp. Vui lòng kiểm tra lại.", "error");
    return;
  }

  messageEl.style.display = "none";
  studentHeader.innerHTML = `Học sinh: <strong>${selectedName}</strong>`;
  
  const errors = errorData[selectedName];

  if (!errors || errors.length === 0) {
    errorListEl.innerHTML = `
      <div class="empty-state">
        ✅ Chưa có lỗi hoặc lỗi thầy giáo chủ nhiệm chưa cập nhật.
      </div>`;
  } else {
    let html = `<h3>Danh sách lỗi vi phạm (${errors.length} lỗi):</h3><ul>`;
    errors.forEach(err => {
      html += `<li>${err}</li>`;
    });
    html += `</ul>`;
    errorListEl.innerHTML = html;
  }

  resultEl.classList.add("show");
  resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

function showMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = "message " + type;
}
</script>
